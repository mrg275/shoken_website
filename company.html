<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Company — Shoken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="colors_and_type.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Brand.jsx"></script>
<script type="text/babel">
const { Nav, Footer, Button, Arrow, Eyebrow, Section, PageHeader, Mark } = window;

function Company() {
  const values = [
    ['Precision is care', 'A line item out of compliance is a paycheck delayed. We treat the paperwork as seriously as the work it funds.'],
    ['Institutional patience', 'Government moves at the speed of trust. We build for decade-long relationships, not quarterly churn.'],
    ['Plain language', 'What we mean is what we say. No magic, no disruption, no revolution. A ledger, kept well.'],
  ];
  return (
    <div>
      <Nav current="company.html" />

      <section style={{ padding: '96px 40px 48px' }}>
        <div style={{ maxWidth: 1200, margin: '0 auto', display: 'grid', gridTemplateColumns: '1.1fr 1fr', gap: 80, alignItems: 'start' }}>
          <div>
            <Eyebrow>Company</Eyebrow>
            <div style={{ fontFamily: 'var(--font-display)', fontSize: 64, lineHeight: 1.08, letterSpacing: '-0.03em', fontWeight: 400, margin: '22px 0 32px' }}>
              Named for an empress who modernized a state.
            </div>
            <div style={{ fontSize: 18, color: 'var(--ash)', lineHeight: 1.55, maxWidth: 560 }}>
              Empress Shōken — consort of Emperor Meiji, principal patron of the Japanese Red Cross, and founder of one of the oldest international humanitarian endowments still active today.
            </div>
            <div style={{ fontSize: 16, color: 'var(--ash)', lineHeight: 1.6, marginTop: 20, maxWidth: 560 }}>
              She sat at the bridge between imperial institution and humanitarian mission — the same bridge our product walks between government and nonprofit. It is a name we intend to live up to.
            </div>
          </div>
          <div style={{ display: 'flex', justifyContent: 'center', paddingTop: 12 }}>
            <div style={{ position: 'relative' }}>
              <Mark size={240} />
              <div style={{ position: 'absolute', bottom: -32, left: 0, right: 0, textAlign: 'center', fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--stone)', letterSpacing: '0.08em' }}>
                昭憲皇太后 · 1849–1914
              </div>
            </div>
          </div>
        </div>
      </section>

      <Section pad="96px 40px" bg="var(--kinari)" style={{ borderTop: '1px solid var(--rule)', borderBottom: '1px solid var(--rule)' }}>
        <div style={{ maxWidth: 820 }}>
          <Eyebrow>Mission</Eyebrow>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 40, lineHeight: 1.15, letterSpacing: '-0.02em', fontWeight: 400, marginTop: 18 }}>
            Public dollars should reach the people they were intended for — on time, in full, without requiring a finance team to fight for them.
          </div>
          <div style={{ fontSize: 16, color: 'var(--ash)', lineHeight: 1.6, marginTop: 26, maxWidth: 640 }}>
            The United States disburses more than $200 billion a year through human services contracts with nonprofit providers. The administrative cost of moving that money — the invoicing, the validation, the reconciliation — runs into the billions. We think that friction is a civic design problem, and we think it can be solved.
          </div>
        </div>
      </Section>

      <Section pad="112px 40px">
        <div style={{ marginBottom: 48 }}>
          <Eyebrow>What we believe</Eyebrow>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 44, lineHeight: 1.08, letterSpacing: '-0.02em', marginTop: 16, fontWeight: 400 }}>
            Three principles.
          </div>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 1, background: 'var(--rule)', border: '1px solid var(--rule)', borderRadius: 6 }}>
          {values.map(([t, d], i) => (
            <div key={t} style={{ background: 'var(--paper)', padding: '40px 32px 44px' }}>
              <div style={{ fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--shu)', marginBottom: 24 }}>{String(i + 1).padStart(2, '0')}</div>
              <div style={{ fontSize: 22, fontWeight: 500, letterSpacing: '-0.02em', marginBottom: 12 }}>{t}</div>
              <div style={{ fontSize: 14.5, lineHeight: 1.6, color: 'var(--ash)' }}>{d}</div>
            </div>
          ))}
        </div>
      </Section>

      <section style={{ padding: '96px 40px', background: 'var(--ink)', color: 'var(--kinari)' }}>
        <div style={{ maxWidth: 1200, margin: '0 auto', display: 'grid', gridTemplateColumns: '1fr 1.4fr', gap: 64 }}>
          <div>
            <Eyebrow color="var(--shu-bright)">Team</Eyebrow>
            <div style={{ fontFamily: 'var(--font-display)', fontSize: 40, lineHeight: 1.1, letterSpacing: '-0.02em', marginTop: 16, fontWeight: 400 }}>
              Assembled for this problem.
            </div>
          </div>
          <div style={{ fontSize: 16, color: 'var(--mist)', lineHeight: 1.65 }}>
            <p style={{ margin: '0 0 18px' }}>
              Shoken is a small team drawn from public finance, nonprofit operations, enterprise accounting software, and applied ML. Several of us ran finance at large nonprofits. Several of us built the systems the other side uses.
            </p>
            <p style={{ margin: 0 }}>
              We take institutional work seriously. Our advisors include former agency contract officers, state comptroller staff, and nonprofit CFOs who have lived the problem for decades. <a href="careers.html" style={{ color: 'var(--kinari)', textDecoration: 'underline', textUnderlineOffset: 4 }}>We are hiring</a>.
            </p>
          </div>
        </div>
      </section>

      <Section pad="96px 40px">
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 40 }}>
          {[
            ['Headquarters', 'New York, NY'],
            ['Offices', 'Washington, DC · Sacramento, CA'],
            ['Backed by', 'Disclosed at close of Series A'],
            ['Founded', '2025'],
            ['Status', 'Private · Delaware C-Corp'],
            ['Press', 'press@shoken.co'],
          ].map(([k, v]) => (
            <div key={k}>
              <div style={{ fontSize: 11, color: 'var(--stone)', letterSpacing: '0.12em', textTransform: 'uppercase', marginBottom: 8 }}>{k}</div>
              <div style={{ fontSize: 15.5, color: 'var(--ink)' }}>{v}</div>
            </div>
          ))}
        </div>
      </Section>

      <section style={{ padding: '120px 40px', textAlign: 'center', borderTop: '1px solid var(--rule)' }}>
        <div style={{ maxWidth: 720, margin: '0 auto' }}>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 52, lineHeight: 1.05, letterSpacing: '-0.03em', fontWeight: 400, margin: '0 0 24px' }}>
            Come build this with us.
          </div>
          <div style={{ display: 'inline-flex', gap: 12 }}>
            <Button size="lg" href="careers.html">See open roles <Arrow /></Button>
            <Button variant="secondary" size="lg">Contact us</Button>
          </div>
        </div>
      </section>
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Company />);
</script>
</body>
</html>
