<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Company — Shoken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="colors_and_type.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Brand.jsx"></script>
<script type="text/babel">
const { Nav, Footer, Button, Arrow, Eyebrow, Section, PageHeader, Mark } = window;

function Company() {
  const values = [
    ['Precision is care.', 'A line item out of compliance is a paycheck delayed. We treat the paperwork as seriously as the work it funds.'],
    ['Technology augments.', 'We’re building tools for the people who run the system — not a replacement for them.'],
    ['Respect the system.', 'Government moves carefully. So do we.'],
  ];
  return (
    <div>
      <Nav current="company.html" />

      <section style={{ padding: '96px 40px 48px' }}>
        <div style={{ maxWidth: 1200, margin: '0 auto', display: 'grid', gridTemplateColumns: '1.1fr 1fr', gap: 80, alignItems: 'start' }}>
          <div>
            <Eyebrow>Company</Eyebrow>
            <div style={{ fontFamily: 'var(--font-display)', fontSize: 60, lineHeight: 1.08, letterSpacing: '-0.03em', fontWeight: 400, margin: '22px 0 32px' }}>
              Named for a leader who modernized social service delivery.
            </div>
            <div style={{ fontSize: 17, color: 'var(--ash)', lineHeight: 1.6, maxWidth: 560 }}>
              Empress Shōken was an innovator and a humanitarian during a period of profound modernization. She pioneered the expansion of social welfare from a crisis response to peacetime institutions — a philosophy that endures today.
            </div>
            <div style={{ fontSize: 16, color: 'var(--ash)', lineHeight: 1.6, marginTop: 18, maxWidth: 560 }}>
              A nonprofit founder, Shōken established a global fund that continues to distribute community-based grants more than a century later.
            </div>
            <div style={{ fontSize: 16, color: 'var(--ink)', lineHeight: 1.6, marginTop: 22, maxWidth: 560, fontStyle: 'italic' }}>
              Enduring infrastructure for human services — then and now.
            </div>
          </div>
          <div style={{ display: 'flex', justifyContent: 'center', paddingTop: 12 }}>
            <div style={{ position: 'relative' }}>
              <Mark size={240} />
              <div style={{ position: 'absolute', bottom: -32, left: 0, right: 0, textAlign: 'center', fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--stone)', letterSpacing: '0.08em' }}>
                昭憲皇太后
              </div>
            </div>
          </div>
        </div>
      </section>

      <Section pad="96px 40px" bg="var(--kinari)" style={{ borderTop: '1px solid var(--rule)', borderBottom: '1px solid var(--rule)' }}>
        <div style={{ maxWidth: 820 }}>
          <Eyebrow>Mission</Eyebrow>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 38, lineHeight: 1.18, letterSpacing: '-0.02em', fontWeight: 400, marginTop: 18 }}>
            Public dollars should fund communities — not paperwork — on time, in full, without requiring finance teams to fight for them.
          </div>
          <div style={{ fontSize: 16, color: 'var(--ash)', lineHeight: 1.65, marginTop: 26, maxWidth: 680 }}>
            State and local government disburse more than $100 billion a year through human services contracts with nonprofit providers. The administrative cost of moving that money — the invoicing, the validation, the reconciliation — runs into the billions. That friction is a civic design problem. We think it can be solved.
          </div>
        </div>
      </Section>

      <Section pad="112px 40px">
        <div style={{ marginBottom: 48 }}>
          <Eyebrow>What we believe</Eyebrow>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 44, lineHeight: 1.08, letterSpacing: '-0.02em', marginTop: 16, fontWeight: 400 }}>
            Three principles.
          </div>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 1, background: 'var(--rule)', border: '1px solid var(--rule)', borderRadius: 6 }}>
          {values.map(([t, d], i) => (
            <div key={t} style={{ background: 'var(--paper)', padding: '40px 32px 44px' }}>
              <div style={{ fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--shu)', marginBottom: 24 }}>{String(i + 1).padStart(2, '0')}</div>
              <div style={{ fontSize: 22, fontWeight: 500, letterSpacing: '-0.02em', marginBottom: 12 }}>{t}</div>
              <div style={{ fontSize: 14.5, lineHeight: 1.6, color: 'var(--ash)' }}>{d}</div>
            </div>
          ))}
        </div>
      </Section>

      {/* TEAM */}
      <section style={{ padding: '96px 40px', background: 'var(--ink)', color: 'var(--kinari)' }}>
        <div style={{ maxWidth: 1200, margin: '0 auto' }}>
          <div style={{ maxWidth: 820, marginBottom: 48 }}>
            <Eyebrow color="var(--shu-bright)">Team</Eyebrow>
            <div style={{ fontFamily: 'var(--font-display)', fontSize: 44, lineHeight: 1.08, letterSpacing: '-0.02em', marginTop: 16, fontWeight: 400 }}>
              Assembled to solve this problem.
            </div>
            <div style={{ fontSize: 16, color: 'var(--mist)', lineHeight: 1.65, marginTop: 22 }}>
              Shoken is a small team drawn from public procurement and financial management, nonprofit operations, government technology, and cyber security. Collectively, we represent more than sixty years of working in, for, and with government.
            </div>
            <div style={{ fontSize: 16, color: 'var(--mist)', lineHeight: 1.65, marginTop: 16 }}>
              Our advisors include city and state leaders, government fiscal and procurement executives, and nonprofit contracting veterans. They have lived this problem — and they are committed to solving it.
            </div>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: '240px 1fr', gap: 40, alignItems: 'start', paddingTop: 32, borderTop: '1px solid rgba(246,241,232,0.16)' }}>
            <div style={{
              width: 240, height: 280, background: 'rgba(246,241,232,0.06)',
              border: '1px solid rgba(246,241,232,0.16)',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--mist)',
              letterSpacing: '0.08em', textAlign: 'center', padding: 20,
              backgroundImage: 'repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(246,241,232,0.03) 8px, rgba(246,241,232,0.03) 9px)',
            }}>
              JG · headshot<br />from LinkedIn
            </div>
            <div>
              <div style={{ fontFamily: 'var(--font-display)', fontSize: 30, fontWeight: 400, letterSpacing: '-0.02em', color: 'var(--kinari)' }}>
                Jennifer Geiling
              </div>
              <div style={{ fontSize: 14, color: 'var(--shu-bright)', marginTop: 6, letterSpacing: '0.02em' }}>
                Founder, CEO
              </div>
              <div style={{ marginTop: 18 }}>
                <a href="https://www.linkedin.com/in/jennifergeiling/" target="_blank" rel="noopener" style={{ fontSize: 13.5, color: 'var(--kinari)', textDecoration: 'underline', textUnderlineOffset: 4 }}>
                  LinkedIn →
                </a>
              </div>
            </div>
          </div>
        </div>
      </section>

      {/* CONTACT BLOCK */}
      <Section pad="96px 40px">
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 40 }}>
          {[
            ['Headquarters', 'New York, NY'],
            ['Founded', '2026'],
            ['Contact us', <a href="mailto:inquiry@agentshoken.com" style={{ color: 'var(--ink)', textDecoration: 'none', borderBottom: '1px solid var(--rule)' }}>inquiry@agentshoken.com</a>],
          ].map(([k, v], i) => (
            <div key={i}>
              <div style={{ fontSize: 11, color: 'var(--stone)', letterSpacing: '0.12em', textTransform: 'uppercase', marginBottom: 8 }}>{k}</div>
              <div style={{ fontSize: 15.5, color: 'var(--ink)' }}>{v}</div>
            </div>
          ))}
        </div>
      </Section>

      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Company />);
</script>
