<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Solution — Shoken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="colors_and_type.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Brand.jsx"></script>
<script type="text/babel">
const { Nav, Footer, Button, Arrow, Eyebrow, Section, PageHeader } = window;

function Stat({ value, label, sub }) {
  return (
    <div style={{ padding: '36px 28px', background: 'var(--paper)' }}>
      <div style={{ fontFamily: 'var(--font-display)', fontSize: 56, fontWeight: 400, letterSpacing: '-0.03em', color: 'var(--ink)', lineHeight: 1 }}>{value}</div>
      <div style={{ fontSize: 14.5, color: 'var(--char)', marginTop: 14, fontWeight: 500 }}>{label}</div>
      {sub && <div style={{ fontSize: 13, color: 'var(--ash)', lineHeight: 1.5, marginTop: 6 }}>{sub}</div>}
    </div>
  );
}

function ProblemStep({ num, title, body }) {
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '64px 1fr', gap: 32, padding: '32px 0', borderTop: '1px solid var(--rule)' }}>
      <div style={{ fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--shu)', paddingTop: 4 }}>{num}</div>
      <div>
        <div style={{ fontFamily: 'var(--font-display)', fontSize: 24, lineHeight: 1.2, letterSpacing: '-0.02em', fontWeight: 400, marginBottom: 10 }}>{title}</div>
        <div style={{ fontSize: 15.5, lineHeight: 1.6, color: 'var(--ash)', maxWidth: 720 }}>{body}</div>
      </div>
    </div>
  );
}

function SolutionStep({ num, title, body }) {
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '64px 1fr', gap: 32, padding: '28px 0', borderTop: '1px solid var(--rule)' }}>
      <div style={{ fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--shu)', paddingTop: 4 }}>{num}</div>
      <div>
        <div style={{ fontSize: 17, fontWeight: 500, letterSpacing: '-0.015em', marginBottom: 8 }}>{title}</div>
        <div style={{ fontSize: 14.5, lineHeight: 1.6, color: 'var(--ash)', maxWidth: 720 }}>{body}</div>
      </div>
    </div>
  );
}

function Solution() {
  return (
    <div>
      <Nav current="product.html" />

      <PageHeader
        eyebrow="Solution"
        title="Weeks to minutes."
        subtitle="Shoken assembles backup documents into invoices and validates them against contract budgets and agency rules. Shoken handles the administrative work in minutes — so agencies can review claims faster and nonprofits can get paid sooner." />

      {/* SCOPE OF IMPACT */}
      <section style={{ padding: '96px 40px', background: 'var(--kinari)', borderBottom: '1px solid var(--rule)' }}>
        <div style={{ maxWidth: 1200, margin: '0 auto' }}>
          <div style={{ maxWidth: 760, marginBottom: 40 }}>
            <Eyebrow>Scope of impact</Eyebrow>
            <div style={{ fontFamily: 'var(--font-display)', fontSize: 44, lineHeight: 1.08, letterSpacing: '-0.02em', marginTop: 18, fontWeight: 400 }}>
              Thousands of contracts.<br />Billions of dollars. Every one a manual review.
            </div>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 1, background: 'var(--rule)', border: '1px solid var(--rule)', borderRadius: 6, marginBottom: 40, overflow: 'hidden' }}>
            <Stat value="$100B+" label="Annual state & local human services contracting" sub="Estimated nationwide spend with nonprofit providers." />
            <Stat value="$16B" label="In one major U.S. city alone" sub="Across more than 5,000 contracts serving over three million residents." />
            <Stat value="7,000+" label="Pending invoices in one comptroller's office" sub="Worth more than $1 billion. In another city, a single agency owes $69M, 40% of it more than two months old." />
          </div>

          <div style={{ fontSize: 16, color: 'var(--ash)', lineHeight: 1.65, maxWidth: 760 }}>
            These contracts pay for our nation's most critical services — care for older adults, children in foster care, families experiencing homelessness, and people with disabilities. When invoices sit, services slow. Some discontinue entirely. Every one of these contracts requires the invoice review process Shoken transforms.
          </div>
        </div>
      </section>

      {/* THE PROBLEM */}
      <Section pad="112px 40px">
        <div style={{ maxWidth: 820, marginBottom: 32 }}>
          <Eyebrow>The problem</Eyebrow>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 44, lineHeight: 1.08, letterSpacing: '-0.02em', marginTop: 18, fontWeight: 400, marginBottom: 22 }}>
            Manual, linear, and layered with oversight.
          </div>
          <div style={{ fontSize: 16, color: 'var(--ash)', lineHeight: 1.6 }}>
            Human services invoice review and approval averages a 20-day Level 1 review and can involve five rounds of revision.
          </div>
        </div>

        <div style={{ marginTop: 32 }}>
          <ProblemStep num="01" title="Provider prepares invoice package offline" body="The nonprofit assembles a claim package with budget category details, expenditure templates, backup receipts, and ledgers. Invoice templates often require line-by-line manual data entry." />
          <ProblemStep num="02" title="Provider submits invoice and emails agency" body="The package is uploaded to an agency system or an email inbox. The nonprofit often has to separately email their agency point of contact for awareness and next steps." />
          <ProblemStep num="03" title="Level 1 line-by-line agency review" body="Agency staff manually compare every line of the package against the contract and agency rules. Errors are flagged and emailed to the provider one at a time, not collectively — each fix triggers another round-trip. The first review can take more than 20 days." />
          <ProblemStep num="04" title="Levels 2–3 for final approval" body="The Level 1-approved invoice passes through two additional reviewers, often through manual handoffs." />
          <ProblemStep num="05" title="Payment" body="Once approved, payment can take an additional week." />
        </div>

        <div style={{ marginTop: 56, padding: '32px 36px', borderLeft: '3px solid var(--shu)', background: 'var(--kinari)' }}>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 22, lineHeight: 1.4, letterSpacing: '-0.015em', color: 'var(--ink)' }}>
            The bottleneck is Step 3. The 20-day review cycle isn't caused by the complexity of the work — it's caused by incomplete or incorrectly formatted submissions that require multiple serial rounds of correction.
          </div>
        </div>
      </Section>

      {/* SHOKEN IS THE SOLUTION */}
      <section style={{ padding: '112px 40px', background: 'var(--ink)', color: 'var(--kinari)' }}>
        <div style={{ maxWidth: 1200, margin: '0 auto' }}>
          <div style={{ maxWidth: 820, marginBottom: 40 }}>
            <Eyebrow color="var(--shu-bright)">Shoken is the solution</Eyebrow>
            <div style={{ fontFamily: 'var(--font-display)', fontSize: 48, lineHeight: 1.05, letterSpacing: '-0.025em', marginTop: 18, fontWeight: 400 }}>
              Shift quality control upstream.<br />Catch problems in minutes — not weeks.
            </div>
            <div style={{ fontSize: 16.5, color: 'var(--mist)', lineHeight: 1.6, marginTop: 22 }}>
              Instead of discovering problems during agency review — triggering weeks of back-and-forth — Shoken catches them at the moment of submission, before the claim ever enters the human review queue.
            </div>
          </div>

          <div style={{ borderTop: '1px solid rgba(246,241,232,0.12)' }}>
            {[
              ['01', 'Agencies define the rules', 'Each agency configures allowability rules, budget categories, and invoice templates. Shoken enforces agency-specific requirements.'],
              ['02', 'Provider uploads documentation in any format', 'Shoken — a closed, secure system — extracts and structures the data to align with agency invoice requirements. Line-by-line manual entry is eliminated.'],
              ['03', 'Validation before submission', 'Each line item is validated against agency rules and the contract budget. Issues are flagged for resolution before submission.'],
              ['04', 'Providers resolve issues in real time', 'Instead of waiting 20 days for a revision request, providers are alerted to errors immediately and fix them before submission. Shoken maintains the audit trail for maximum transparency.'],
              ['05', 'Provider approves final invoice; Shoken submits to agency', 'Once the nonprofit approves the final invoice, Shoken routes it to the agency team, ready for review.'],
              ['06', 'Agency staff maintain full approval authority', 'Shoken handles the tedious, manual comparison work. People keep judgment.'],
            ].map(([n, t, d]) => (
              <div key={n} style={{ display: 'grid', gridTemplateColumns: '64px 1fr', gap: 32, padding: '28px 0', borderBottom: '1px solid rgba(246,241,232,0.12)' }}>
                <div style={{ fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--shu-bright)', paddingTop: 4 }}>{n}</div>
                <div>
                  <div style={{ fontSize: 17.5, fontWeight: 500, letterSpacing: '-0.015em', marginBottom: 8, color: 'var(--kinari)' }}>{t}</div>
                  <div style={{ fontSize: 14.5, lineHeight: 1.65, color: 'var(--mist)', maxWidth: 760 }}>{d}</div>
                </div>
              </div>
            ))}
          </div>

          <div style={{ marginTop: 64, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 32 }}>
            <div style={{ padding: '32px 36px', border: '1px solid rgba(246,241,232,0.16)' }}>
              <div style={{ fontFamily: 'var(--font-display)', fontSize: 26, lineHeight: 1.3, letterSpacing: '-0.02em', color: 'var(--kinari)' }}>
                Twenty-day reviews are condensed to minutes.
              </div>
            </div>
            <div style={{ padding: '32px 36px', border: '1px solid rgba(246,241,232,0.16)' }}>
              <div style={{ fontFamily: 'var(--font-display)', fontSize: 26, lineHeight: 1.3, letterSpacing: '-0.02em', color: 'var(--kinari)' }}>
                Five rounds of revision become a single digital conversation.
              </div>
            </div>
          </div>
        </div>
      </section>

      {/* CTA */}
      <section style={{ padding: '120px 40px', textAlign: 'center' }}>
        <div style={{ maxWidth: 720, margin: '0 auto' }}>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 52, lineHeight: 1.05, letterSpacing: '-0.03em', fontWeight: 400, margin: '0 0 24px' }}>
            See it on your own contracts.
          </div>
          <div style={{ fontSize: 16.5, color: 'var(--ash)', marginBottom: 32 }}>
            We'll load a recent invoice of yours and show you the validation trace.
          </div>
          <Button size="lg">Request a demo <Arrow /></Button>
        </div>
      </section>
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Solution />);
</script>
</body>
</html>
