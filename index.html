<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shoken — The ledger between mission and government</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="colors_and_type.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Brand.jsx"></script>
<script type="text/babel" src="HeroProductFrame.jsx"></script>
<script type="text/babel">
const { Nav, Footer, Button, Arrow, Eyebrow, Mark, Wordmark, HeroProductFrame, Section, Badge } = window;

const SAMPLE_LOGOS = [
  { name: 'BronxWorks', weight: 700 },
  { name: 'Henry Street', font: 'var(--font-display)', weight: 500 },
  { name: 'Good Shepherd', weight: 600 },
  { name: 'Phipps Houses', weight: 600, tracking: '0.02em' },
  { name: 'Safe Horizon', weight: 500, italic: true },
  { name: 'Coalition for Homeless', weight: 500 },
];

function LogoRow({ logos, color = 'var(--char)' }) {
  return (
    <div style={{ display: 'flex', gap: 42, alignItems: 'center', flexWrap: 'wrap', columnGap: 48, rowGap: 18 }}>
      {logos.map((l, i) => (
        <div key={i} style={{
          fontFamily: l.font || 'var(--font-sans)',
          fontSize: 17, fontWeight: l.weight || 600, color,
          letterSpacing: l.tracking || '-0.02em',
          fontStyle: l.italic ? 'italic' : 'normal',
        }}>{l.name}</div>
      ))}
    </div>
  );
}

function Home() {
  return (
    <div>
      <Nav current="index.html" />

      {/* HERO */}
      <section style={{ padding: '88px 40px 72px' }}>
        <div style={{ maxWidth: 1200, margin: '0 auto' }}>
          <Eyebrow>Human services reimbursement</Eyebrow>
          <h1 style={{
            fontFamily: 'var(--font-display)', fontSize: 84, lineHeight: 1.05, fontWeight: 400,
            letterSpacing: '-0.03em', margin: '22px 0 56px', maxWidth: 920,
          }}>
            The ledger between<br />nonprofits and government.
          </h1>
          <p style={{ fontSize: 20, lineHeight: 1.5, color: 'var(--ash)', maxWidth: 640, margin: '0 0 36px' }}>
            Shoken assembles and validates human services contract invoices for government approval and payment. Weeks of administrative work, compressed to minutes.
          </p>
          <div style={{ display: 'flex', gap: 12, alignItems: 'center', marginBottom: 72 }}>
            <Button size="lg">Request access <Arrow /></Button>
            <Button variant="secondary" size="lg">See how it works</Button>
          </div>
          <HeroProductFrame />
        </div>
      </section>

      {/* HOW SHOKEN WORKS — 4 steps */}
      <Section pad="112px 40px">
        <div style={{ maxWidth: 820, marginBottom: 56 }}>
          <Eyebrow>How Shoken works</Eyebrow>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 46, lineHeight: 1.08, letterSpacing: '-0.02em', marginTop: 18, fontWeight: 400 }}>
            People stay. Paperwork goes.<br />Delays removed.
          </div>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 1, background: 'var(--rule)', border: '1px solid var(--rule)', borderRadius: 6, overflow: 'hidden' }}>
          {[
            ['01', 'Ingest', 'Nonprofit staff upload expenditure documentation — receipts, timesheets, proof of payment, and ledger exports.'],
            ['02', 'Assemble', 'Shoken consolidates backup into agency-ready invoices for nonprofit approval.'],
            ['03', 'Validate', 'Shoken matches nonprofit-approved invoices against contract budgets and agency rules — and addresses errors immediately with the provider.'],
            ['04', 'Submit', 'Shoken forwards screened invoices, with audit trails, to agency teams for faster human review and payment approval.'],
          ].map(([n, t, d]) => (
            <div key={n} style={{ background: 'var(--paper)', padding: '40px 28px 44px' }}>
              <div style={{ fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--shu)', marginBottom: 28 }}>{n}</div>
              <div style={{ fontSize: 22, fontWeight: 500, letterSpacing: '-0.02em', marginBottom: 10 }}>{t}</div>
              <div style={{ fontSize: 14.5, lineHeight: 1.55, color: 'var(--ash)' }}>{d}</div>
            </div>
          ))}
        </div>
      </Section>

      {/* TWO-SIDED */}
      <Section pad="112px 40px">
        <div style={{ maxWidth: 820, marginBottom: 56 }}>
          <Eyebrow>Who Shoken serves</Eyebrow>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 46, lineHeight: 1.08, letterSpacing: '-0.02em', marginTop: 18, fontWeight: 400 }}>
            Designed for government teams.<br />Nonprofits benefit.
          </div>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 24 }}>
          {[
            {
              who: 'For government agencies',
              t: 'Pre-approved claims. No more line-by-line matching.',
              d: 'Shoken screens claims at the point of nonprofit submission and resolves errors directly with the provider. Agencies only receive pre-approved claims. No more back-and-forth emails. Faster Level 1 cycle times.',
              href: 'agencies.html',
            },
            {
              who: 'For nonprofit organizations',
              t: 'No more compilation. No more black boxes.',
              d: 'Nonprofit staff submit backup documentation. Shoken extracts the data to create invoices and identify errors. The provider collaborates with the system to resolve issues in real time. No more invoice compilation, no more revision emails, no more lengthy payment reviews.',
              href: 'nonprofits.html',
            },
          ].map((card) => (
            <a key={card.who} href={card.href} style={{ textDecoration: 'none', color: 'inherit' }}>
              <div style={{
                border: '1px solid var(--rule)', borderRadius: 8, padding: '36px 32px 32px',
                background: 'var(--paper)', display: 'flex', flexDirection: 'column', height: '100%',
                transition: 'box-shadow 200ms var(--ease)',
              }}>
                <Eyebrow>{card.who}</Eyebrow>
                <div style={{ fontFamily: 'var(--font-display)', fontSize: 28, fontWeight: 400, letterSpacing: '-0.02em', lineHeight: 1.15, margin: '18px 0 14px' }}>
                  {card.t}
                </div>
                <div style={{ fontSize: 14.5, color: 'var(--ash)', lineHeight: 1.55 }}>{card.d}</div>
                <div style={{ marginTop: 'auto', paddingTop: 20, fontSize: 13.5, color: 'var(--shu)', fontWeight: 500 }}>Learn more →</div>
              </div>
            </a>
          ))}
        </div>
      </Section>

      {/* HOW SHOKEN RUNS */}
      <Section pad="96px 40px">
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1.3fr', gap: 64, alignItems: 'center' }}>
          <div>
            <Eyebrow>How Shoken runs</Eyebrow>
            <div style={{ fontFamily: 'var(--font-display)', fontSize: 40, lineHeight: 1.1, letterSpacing: '-0.02em', marginTop: 16, fontWeight: 400, marginBottom: 20 }}>
              Stand-alone app or integrated technology — Shoken runs on it all.
            </div>
            <div style={{ fontSize: 15.5, color: 'var(--ash)', lineHeight: 1.55, maxWidth: 480 }}>
              Ingest data in its native format — no conversions, no reformatting, no file format requirements. Upload from QuickBooks, Sage Intacct, NetSuite, Blackbaud Financial Edge, ADP, Paychex.
            </div>
            <div style={{ fontSize: 15.5, color: 'var(--ash)', lineHeight: 1.55, marginTop: 16, maxWidth: 480 }}>
              Integrate with end-to-end procurement systems or download to desktop. Comprehensive security readiness program — actively pursuing SOC 2 certification.
            </div>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 1, background: 'var(--rule)', border: '1px solid var(--rule)', borderRadius: 6, overflow: 'hidden' }}>
            {['QuickBooks', 'Sage Intacct', 'NetSuite', 'Blackbaud', 'ADP', 'Paychex'].map((n) => (
              <div key={n} style={{ background: 'var(--paper)', padding: '24px 16px', fontSize: 13, fontWeight: 500, letterSpacing: '-0.01em', color: 'var(--char)' }}>{n}</div>
            ))}
          </div>
        </div>
      </Section>

      {/* CTA */}
      <section style={{ padding: '120px 40px', textAlign: 'center', borderTop: '1px solid var(--rule)' }}>
        <div style={{ maxWidth: 720, margin: '0 auto' }}>
          <Eyebrow>Request a demo</Eyebrow>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 58, lineHeight: 1.05, letterSpacing: '-0.03em', margin: '22px 0 20px', fontWeight: 400 }}>
            Cut the paperwork.<br />Keep the oversight.
          </div>
          <div style={{ fontSize: 17, color: 'var(--ash)', maxWidth: 520, margin: '0 auto 32px', lineHeight: 1.55 }}>
            Shoken is onboarding a limited cohort of agencies and nonprofits in 2026.
          </div>
          <div style={{ display: 'inline-flex', gap: 12 }}>
            <Button size="lg">Request a demo <Arrow /></Button>
            <Button variant="secondary" size="lg">Contact us</Button>
          </div>
        </div>
      </section>

      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Home />);
</script>
</body>
</html>
