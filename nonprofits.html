<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For nonprofits — Shoken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="colors_and_type.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Brand.jsx"></script>
<script type="text/babel">
const { Nav, Footer, Button, Arrow, Eyebrow, Section, PageHeader } = window;

function BeforeAfter() {
  const before = [
    ['Days 1–3', 'Finance pulls the ledger, reconciles to program reports.'],
    ['Days 4–7', 'Program officers chase missing timesheets and receipts.'],
    ['Days 8–10', 'Reformat into each agency\'s invoice template.'],
    ['Days 11–14', 'Finance reviews, updates, submits.'],
    ['Days 15–35', 'Wait. Revise. Resubmit. Email. Wait. Revise. Resubmit. Email. Wait.'],
    ['Day 36', 'Invoice moves to Level 2 agency review.'],
  ];
  const after = [
    ['Day 1', 'Close the books, gather backup documentation. Upload ledger and data to Shoken.'],
    ['Day 1', 'Invoice is assembled, validated, questions resolved in real time, invoice finalized.'],
    ['Day 2', 'Invoice moves to agency review.'],
  ];
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 0, border: '1px solid var(--rule)', borderRadius: 8, overflow: 'hidden' }}>
      <div style={{ padding: '28px 28px 32px', borderRight: '1px solid var(--rule)', background: 'var(--kinari)' }}>
        <div style={{ fontSize: 11, color: 'var(--stone)', letterSpacing: '0.12em', textTransform: 'uppercase', marginBottom: 16 }}>Before Shoken</div>
        <div style={{ fontFamily: 'var(--font-display)', fontSize: 26, letterSpacing: '-0.02em', fontWeight: 400, marginBottom: 22 }}>20-day reviews</div>
        {before.map(([d, b], i) => (
          <div key={i} style={{ display: 'grid', gridTemplateColumns: '90px 1fr', gap: 12, padding: '12px 0', borderTop: '1px solid var(--rule)', fontSize: 13.5 }}>
            <span style={{ fontFamily: 'var(--font-mono)', fontSize: 11.5, color: 'var(--stone)' }}>{d}</span>
            <span style={{ color: 'var(--char)' }}>{b}</span>
          </div>
        ))}
      </div>
      <div style={{ padding: '28px 28px 32px', background: 'var(--paper)' }}>
        <div style={{ fontSize: 11, color: 'var(--shu)', letterSpacing: '0.12em', textTransform: 'uppercase', marginBottom: 16, display: 'flex', alignItems: 'center', gap: 8 }}>
          <span style={{ width: 6, height: 6, background: 'var(--shu)' }} />With Shoken
        </div>
        <div style={{ fontFamily: 'var(--font-display)', fontSize: 26, letterSpacing: '-0.02em', fontWeight: 400, marginBottom: 22 }}>2 days, one closing</div>
        {after.map(([d, b], i) => (
          <div key={i} style={{ display: 'grid', gridTemplateColumns: '90px 1fr', gap: 12, padding: '12px 0', borderTop: '1px solid var(--rule)', fontSize: 13.5 }}>
            <span style={{ fontFamily: 'var(--font-mono)', fontSize: 11.5, color: 'var(--stone)' }}>{d}</span>
            <span style={{ color: 'var(--ink)' }}>{b}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function NonprofitBenefits() {
  const rows = [
    ['Get paid faster.', 'Errors get caught and resolved before submission — not weeks into agency review. Pre-validated invoices move through faster, payment cycles compress, and cash flow is more predictable.'],
    ['Focus on mission, not paperwork.', 'The hours your team spends compiling vouchers, chasing receipts, and responding to revisions are hours that don’t reach the communities you serve. Shoken gives those hours back.'],
    ['Job satisfaction.', 'Experienced fiscal and compliance staff are hard to hire and harder to keep. Shoken takes the most tedious, burnout-inducing work off their plates so they can focus on financial strategy, budgeting, and the work that uses their expertise.'],
    ['Open the invoicing black box.', 'Government contracting can feel like submitting into a void — invoices disappear, revisions come back without explanation, and status updates depend on who you know. Shoken shows you every step: which rule triggered every flag, where every invoice sits in the review process, and exactly what needs to happen next.'],
    ['Data-driven operations.', 'Which errors come up most? Which agencies flag which issues? Which programs generate the most revisions? Every submission and revision is logged and exportable — use the data to strengthen staff training, fix template issues, and target process improvements.'],
    ['Built for your team.', 'Your team was hired to serve communities, not to format paperwork. Shoken gives them back the hours.'],
  ];
  return (
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 1, background: 'var(--rule)', border: '1px solid var(--rule)', borderRadius: 6 }}>
      {rows.map(([t, d]) => (
        <div key={t} style={{ background: 'var(--paper)', padding: '32px 28px' }}>
          <div style={{ fontSize: 17, fontWeight: 500, letterSpacing: '-0.015em', marginBottom: 8 }}>{t}</div>
          <div style={{ fontSize: 14, lineHeight: 1.55, color: 'var(--ash)' }}>{d}</div>
        </div>
      ))}
    </div>
  );
}

function Nonprofits() {
  return (
    <div>
      <Nav current="nonprofits.html" />
      <PageHeader
        eyebrow="For nonprofits"
        title="Cash flow clarity. Mission focused."
        subtitle="Less time on paperwork. More time on mission. Faster invoicing in between." />

      <Section pad="56px 40px 96px">
        <BeforeAfter />
      </Section>

      <section style={{ padding: '96px 40px', background: 'var(--kinari)', borderTop: '1px solid var(--rule)', borderBottom: '1px solid var(--rule)' }}>
        <div style={{ maxWidth: 1200, margin: '0 auto' }}>
          <div style={{ maxWidth: 720, marginBottom: 48 }}>
            <Eyebrow>What changes</Eyebrow>
            <div style={{ fontFamily: 'var(--font-display)', fontSize: 44, lineHeight: 1.08, letterSpacing: '-0.02em', marginTop: 16, fontWeight: 400 }}>
              Work the contract.<br />Not the paperwork.
            </div>
          </div>
          <NonprofitBenefits />
        </div>
      </section>



      <section style={{ padding: '120px 40px', textAlign: 'center', borderTop: '1px solid var(--rule)' }}>
        <div style={{ maxWidth: 720, margin: '0 auto' }}>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 52, lineHeight: 1.05, letterSpacing: '-0.03em', fontWeight: 400, margin: '0 0 24px' }}>
            Close on the second.
          </div>
          <div style={{ fontSize: 16.5, color: 'var(--ash)', marginBottom: 32 }}>
            We'll load one recent invoice and show you where the time goes.
          </div>
          <Button size="lg">Request access <Arrow /></Button>
        </div>
      </section>
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Nonprofits />);
</script>
</body>
</html>
